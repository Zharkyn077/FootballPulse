<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>FootballPulse – Tickets</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link
        href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@700;800&family=Figtree:wght@400;600;700&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
</head>

<body data-page="tickets">
    <main class="container">
        <div class="page-head">
            <h1>Demo ticket booking</h1>
            <p class="meta">Educational simulation only. No real tickets are sold or emails sent.</p>
        </div>
        <div class="row">
            <div class="col-lg-7">
                <div id="ok" class="success-box" role="status"></div>
                <form id="f" class="fp-card" novalidate>
                    <div class="mb-3"><label for="name" class="form-label">Full name</label><input id="name"
                            class="form-control" autocomplete="name">
                        <div id="e-name" class="invalid-feedback"></div>
                    </div>
                    <div class="row">
                        <div class="col-md-6 mb-3"><label for="email" class="form-label">Email</label><input id="email"
                                type="email" class="form-control" autocomplete="email">
                            <div id="e-email" class="invalid-feedback"></div>
                        </div>
                        <div class="col-md-6 mb-3"><label for="phone" class="form-label">Phone</label><input id="phone"
                                type="tel" class="form-control" autocomplete="tel">
                            <div id="e-phone" class="invalid-feedback"></div>
                        </div>
                    </div>
                    <div class="mb-3"><label for="match" class="form-label">Match</label><select id="match"
                            class="form-select"></select></div>
                    <p class="form-label mb-1">Pick your stand</p>
                    <div class="pitch mb-3" role="group" aria-label="Stand"><button type="button" data-s="standard"
                            class="st n">North stand<br><small>Standard</small></button><button type="button"
                            data-s="family" class="st w">West<br><small>Family</small></button>
                        <div class="mid" aria-hidden="true"></div><button type="button" data-s="vip"
                            class="st e">East<br><small>VIP</small></button><button type="button" data-s="standard"
                            class="st s">South stand<br><small>Standard</small></button>
                    </div>
                    <div class="row">
                        <div class="col-md-6 mb-3"><label for="cat" class="form-label">Category</label><select id="cat"
                                class="form-select">
                                <option value="standard">Standard</option>
                                <option value="family">Family (−20%)</option>
                                <option value="vip">VIP (×2.5)</option>
                            </select></div>
                        <div class="col-md-6 mb-3"><label for="qty" class="form-label">Tickets (1–6)</label><input
                                id="qty" type="number" class="form-control" value="1">
                            <div id="e-qty" class="invalid-feedback"></div>
                        </div>
                    </div>
                    <div class="mb-3"><label for="pass" class="form-label">Account password</label><input id="pass"
                            type="password" class="form-control" autocomplete="new-password">
                        <div id="e-pass" class="invalid-feedback"></div>
                    </div>
                    <div class="form-check mb-3"><input id="terms" type="checkbox" class="form-check-input"><label
                            for="terms" class="form-check-label">I accept the ticket terms</label>
                        <div id="e-terms" class="invalid-feedback d-block"></div>
                    </div>
                    <button class="btn btn-fp w-100" type="submit">Confirm booking</button>
                </form>
            </div>
            <div class="col-lg-5 mt-4 mt-lg-0">
                <div class="fp-card">
                    <p class="meta mb-0">Your total</p>
                    <div class="total" id="total">$0</div>
                    <p class="meta mb-0">Updates as you change match, category or quantity.</p>
                </div>
            </div>
        </div>
    </main>
    <script src="https://cdn.jsdelivr.net/npm/jquery@3.7.1/dist/jquery.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="js/data.js"></script>
    <script src="js/layout.js"></script>
    <script src="js/tickets.js"></script>
    <footer class="container py-3"><small class="meta">Data: Premier League / UEFA / FIFA (see <a
                href="DATA_SOURCES.md">sources</a>). Demo features are simulations. See project credits in the
            report.</small></footer>
</body>

</html>
